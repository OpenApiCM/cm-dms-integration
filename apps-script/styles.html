<style>
  :root {
    --navy: #1f3864;
    --blue: #2e75b6;
    --blue-50: #eaf2fb;
    --green: #3f7d20;
    --green-50: #eaf5e3;
    --amber: #a35a00;
    --amber-50: #fdf1e4;
    --red: #b42318;
    --ink: #1d2433;
    --ink-2: #4a5468;
    --ink-3: #7a8499;
    --line: #e3e8ef;
    --bg: #f6f8fb;
    --card: #ffffff;
    --code-bg: #0f1b2d;
    --code-ink: #dbe7ff;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --m-get: #0f7b5f; --m-post: #2e75b6; --m-put: #b26a00; --m-patch: #7046b8; --m-delete: #b42318;
    --dms: #1f3864; --cm: #3f7d20;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: var(--mono); font-size: .86em; background: #eef2f7; color: #1b3b6f; padding: .1em .38em; border-radius: 5px; white-space: nowrap; }
  strong { font-weight: 650; }
  .boot { padding: 40px; color: var(--ink-3); }

  /* ---------- Top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: var(--navy); color: #fff; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand b { font-size: 18px; letter-spacing: .2px; }
  .brand span { opacity: .8; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .spacer { flex: 1; }
  .ver { font-size: 12px; opacity: .75; white-space: nowrap; }
  .langs { display: flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
  .langs button { border: 0; background: transparent; color: #fff; font: 600 12px var(--font); padding: 5px 11px; border-radius: 999px; cursor: pointer; letter-spacing: .5px; }
  .langs button.on { background: #fff; color: var(--navy); }
  .menu-btn { display: none; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 8px; padding: 5px 10px; font: 600 13px var(--font); cursor: pointer; }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
  .sidebar { position: sticky; top: 52px; align-self: start; height: calc(100vh - 52px); overflow-y: auto; padding: 20px 12px 40px 20px; border-right: 1px solid var(--line); }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink-2); font: 500 14px var(--font); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .nav-item:hover { background: #eaeef4; color: var(--ink); }
  .nav-item.on { background: var(--blue-50); color: var(--navy); font-weight: 650; }
  .nav-item .ic { width: 20px; text-align: center; }
  .nav-sep { height: 1px; background: var(--line); margin: 10px 6px; }
  .main { padding: 28px 40px 60px; min-width: 0; }
  .content { max-width: 920px; }

  /* ---------- Typography blocks ---------- */
  .sec-title { font-size: 30px; line-height: 1.2; color: var(--navy); margin: 0 0 6px; font-weight: 750; letter-spacing: -.3px; }
  .sec-summary { color: var(--ink-3); margin: 0 0 22px; font-size: 16px; }
  h2.h { font-size: 21px; color: var(--navy); margin: 36px 0 12px; padding-top: 6px; font-weight: 700; }
  h3.h3 { font-size: 16px; color: var(--ink); margin: 24px 0 10px; font-weight: 700; }
  p.p { margin: 0 0 14px; color: var(--ink); }
  ul.list { margin: 0 0 16px; padding-left: 22px; }
  ul.list li { margin: 4px 0; }

  .hero { background: linear-gradient(120deg, var(--navy), var(--blue)); color: #fff; border-radius: 14px; padding: 30px 32px; margin-bottom: 22px; }
  .hero h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.2; font-weight: 750; }
  .hero p { margin: 0; opacity: .9; font-size: 16px; }
  .hero .pills { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .hero .pill { background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }

  /* ---------- Callouts ---------- */
  .callout { border-radius: var(--radius); padding: 14px 18px; margin: 16px 0 18px; border: 1px solid; }
  .callout .ct { font-weight: 700; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .callout ul { margin: 0; padding-left: 20px; }
  .callout li { margin: 3px 0; }
  .callout.info { background: var(--blue-50); border-color: #cfe0f3; }
  .callout.info .ct { color: var(--blue); }
  .callout.warn { background: var(--amber-50); border-color: #f4d9b9; }
  .callout.warn .ct { color: var(--amber); }
  .callout.tip { background: var(--green-50); border-color: #cfe5c2; }
  .callout.tip .ct { color: var(--green); }

  /* ---------- Cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 18px 0 8px; }
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); color: var(--ink); transition: border-color .15s, transform .15s; cursor: pointer; text-align: left; font: inherit; }
  .card:hover { border-color: var(--blue); transform: translateY(-1px); text-decoration: none; }
  .card .ci { font-size: 22px; }
  .card .cti { font-weight: 700; color: var(--navy); margin: 4px 0 2px; }
  .card .ctx { color: var(--ink-2); font-size: 13.5px; line-height: 1.45; word-break: break-word; }
  .card .ext { float: right; color: var(--ink-3); font-size: 13px; }

  /* ---------- Architecture ---------- */
  .arch { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 0; align-items: stretch; margin: 16px 0 10px; }
  .arch .node { border-radius: 12px; padding: 22px 16px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .arch .node b { font-size: 18px; display: block; }
  .arch .node span { font-size: 13px; opacity: .85; }
  .arch .dms { background: #e3eaf6; color: var(--dms); border: 2px solid #b9c8e3; }
  .arch .cm { background: #e4f1dc; color: var(--cm); border: 2px solid #bcdcab; }
  .arch .wires { display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 10px; }
  .wire { display: block; border-radius: 8px; padding: 6px 10px; text-align: center; font-size: 13px; color: var(--ink); }
  .wire:hover { background: #fff; text-decoration: none; box-shadow: var(--shadow); }
  .wire .line { position: relative; height: 2px; margin: 6px 0; }
  .wire.r .line { background: var(--dms); }
  .wire.l .line { background: var(--cm); }
  .wire.r .line::after, .wire.l .line::after { content: ""; position: absolute; top: -5px; border: 6px solid transparent; }
  .wire.r .line::after { right: -2px; border-left: 9px solid var(--dms); border-right: 0; }
  .wire.l .line::after { left: -2px; border-right: 9px solid var(--cm); border-left: 0; }
  .wire b { display: block; font-size: 13px; }
  .wire.r b { color: var(--dms); }
  .wire.l b { color: var(--cm); }
  .wire small { color: var(--ink-3); }

  /* ---------- Data model ---------- */
  .model { display: flex; align-items: stretch; gap: 0; margin: 12px 0 8px; }
  .model .ent { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .model .ent:hover { border-color: var(--blue); }
  .model .ent .ei { font-size: 22px; }
  .model .ent b { display: block; color: var(--navy); margin: 2px 0; }
  .model .ent p { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
  .model .arrow { align-self: center; color: var(--ink-3); font-size: 22px; padding: 0 8px; }

  /* ---------- Steps ---------- */
  .steps { list-style: none; margin: 8px 0 20px; padding: 0; counter-reset: s; }
  .steps li { position: relative; padding: 0 0 18px 52px; }
  .steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 700; display: grid; place-items: center; }
  .steps li::after { content: ""; position: absolute; left: 16px; top: 36px; bottom: 2px; width: 2px; background: var(--line); }
  .steps li:last-child::after { display: none; }
  .steps b { display: block; color: var(--navy); padding-top: 5px; }
  .steps span { color: var(--ink-2); }

  /* ---------- Tables ---------- */
  .tbl-wrap { overflow-x: auto; margin: 10px 0 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
  table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
  .tbl th { text-align: left; background: #f1f4f9; color: var(--ink-2); font-weight: 650; font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl td.path { font-family: var(--mono); font-size: 13px; color: var(--ink); min-width: 180px; }
  .tbl td.fname { font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tbl td.ftype { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .tbl td.nowrap { white-space: nowrap; }
  .tbl td code { white-space: normal; }

  .mth { display: inline-block; min-width: 58px; text-align: center; font: 700 11.5px var(--mono); color: #fff; border-radius: 5px; padding: 3px 6px; letter-spacing: .3px; }
  .mth.GET { background: var(--m-get); } .mth.POST { background: var(--m-post); } .mth.PUT { background: var(--m-put); } .mth.PATCH { background: var(--m-patch); } .mth.DELETE { background: var(--m-delete); }
  .dir { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .dir.dms2cm { background: #e3eaf6; color: var(--dms); }
  .dir.cm2dms { background: #e4f1dc; color: var(--cm); }
  .req { font-size: 12.5px; font-weight: 650; white-space: nowrap; }
  .req.y { color: var(--green); } .req.n { color: var(--ink-3); } .req.c { color: var(--amber); }
  .tag { display: inline-block; font-size: 11px; font-weight: 650; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .tag.core { background: var(--blue-50); color: var(--blue); }
  .tag.opt, .tag.extra { background: #f0f1f4; color: var(--ink-3); }
  .tag.std { background: var(--blue-50); color: var(--blue); }
  .tag.crm { background: #f3e8fd; color: #7046b8; }
  .tag.planner { background: #fdf1e4; color: var(--amber); }

  .retry { list-style: none; display: flex; gap: 0; padding: 0; margin: 12px 0 18px; overflow-x: auto; }
  .retry li { flex: 1; min-width: 120px; position: relative; padding: 0 8px; text-align: center; }
  .retry li::before { content: ""; position: absolute; top: 15px; left: 0; right: 0; height: 2px; background: var(--line); z-index: 0; }
  .retry li:first-child::before { left: 50%; }
  .retry li:last-child::before { right: 50%; }
  .retry .dot { position: relative; z-index: 1; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--amber); color: #fff; font-weight: 700; font-size: 13px; }
  .retry li:first-child .dot { background: var(--navy); }
  .retry b { display: block; margin-top: 6px; color: var(--ink); font-size: 13.5px; }
  .retry small { color: var(--ink-3); font-size: 12px; }
  .doclink { white-space: nowrap; font-size: 13px; }

  /* ---------- Code ---------- */
  .code { position: relative; margin: 10px 0 18px; border-radius: var(--radius); overflow: hidden; background: var(--code-bg); }
  .code .code-h { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; background: #16253c; color: #a9b8d3; font-size: 12.5px; font-weight: 600; }
  .code pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: var(--code-ink); font: 13px/1.55 var(--mono); }
  .code .copy { border: 1px solid #34486a; background: transparent; color: #cfe0ff; border-radius: 6px; padding: 2px 9px; font: 600 12px var(--font); cursor: pointer; }
  .code .copy:hover { background: #22375a; }
  .tok-k { color: #8cc8ff; } .tok-s { color: #b5e48c; } .tok-n { color: #ffcf7a; } .tok-b { color: #ff9fb0; } .tok-h { color: #f7a8ff; }

  /* ---------- Tabs ---------- */
  .tabs { margin: 12px 0 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
  .tabs .tab-h { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 6px 6px 0; overflow-x: auto; }
  .tabs .tab-h button { border: 0; background: transparent; font: 600 14px var(--font); color: var(--ink-3); padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs .tab-h button.on { color: var(--navy); border-bottom-color: var(--blue); }
  .tabs .tab-b { padding: 14px 16px 2px; }

  /* ---------- Sequence diagram ---------- */
  .seq { margin: 12px 0 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
  .seq-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fafbfd; flex-wrap: wrap; }
  .seq-toolbar .hint { color: var(--ink-3); font-size: 12.5px; flex: 1; min-width: 160px; }
  .seq-toolbar button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 4px 10px; font: 600 13px var(--font); color: var(--ink-2); cursor: pointer; }
  .seq-toolbar button:hover { border-color: var(--blue); color: var(--blue); }
  .seq-svg { display: block; width: 100%; height: auto; }
  .seq-svg .msg { cursor: pointer; transition: opacity .2s; }
  .seq-svg.dim .msg { opacity: .22; }
  .seq-svg.dim .msg.on { opacity: 1; }
  .seq-svg .msg:hover .hit { fill: rgba(46,117,182,.06); }
  .seq-steps { list-style: none; margin: 0; padding: 4px 0; border-top: 1px solid var(--line); }
  .seq-steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 7px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .seq-steps li:hover { background: #f6f9fd; }
  .seq-steps li.on { background: var(--blue-50); border-left-color: var(--blue); }
  .seq-steps .n { width: 24px; height: 24px; border-radius: 50%; background: #eef2f7; color: var(--ink-2); font: 700 12px var(--font); display: grid; place-items: center; margin-top: 1px; }
  .seq-steps li.on .n { background: var(--blue); color: #fff; }
  .seq-steps .who { font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .seq-steps .lbl { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); word-break: break-word; }
  .seq-steps .lbl.t { font-family: var(--font); font-size: 14px; }
  .seq-steps .note { color: var(--ink-2); font-size: 13.5px; }

  /* ---------- Explorer ---------- */
  .explorer-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0 12px; }
  .explorer-bar input[type=search] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: 14px var(--font); background: #fff; }
  .explorer-bar input[type=search]:focus { outline: 2px solid var(--blue-50); border-color: var(--blue); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 7px 11px; font: 600 13px var(--font); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--navy); color: #fff; }
  .chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .count { color: var(--ink-3); font-size: 13px; }
  .grp-h td { background: #f8fafc; font-weight: 700; color: var(--navy); font-size: 13px; }

  /* ---------- Checklist ---------- */
  .progress { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  .bar { flex: 1; height: 10px; background: #e7ecf3; border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .3s; }
  .progress .pct { font-weight: 700; color: var(--navy); min-width: 46px; text-align: right; }
  .progress button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 4px 10px; font: 600 12.5px var(--font); color: var(--ink-2); cursor: pointer; }
  .cl-group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; }
  .cl-group h4 { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--navy); font-size: 15px; display: flex; justify-content: space-between; }
  .cl-group h4 small { color: var(--ink-3); font-weight: 600; }
  .cl-item { display: flex; gap: 10px; padding: 8px 16px; cursor: pointer; align-items: flex-start; }
  .cl-item + .cl-item { border-top: 1px dashed var(--line); }
  .cl-item input { margin-top: 5px; width: 16px; height: 16px; accent-color: var(--green); flex: none; }
  .cl-item.done span { color: var(--ink-3); text-decoration: line-through; }
  .muted { color: var(--ink-3); font-size: 13px; }

  /* ---------- Changelog ---------- */
  .changelog { list-style: none; padding: 0; margin: 8px 0; }
  .changelog li { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .changelog b { color: var(--navy); }
  .changelog small { display: block; color: var(--ink-3); }

  /* ---------- Pager ---------- */
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }
  .pager button { flex: 1; max-width: 48%; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 12px 16px; cursor: pointer; font: inherit; text-align: left; box-shadow: var(--shadow); }
  .pager button:hover { border-color: var(--blue); }
  .pager button.nx { text-align: right; margin-left: auto; }
  .pager small { display: block; color: var(--ink-3); font-size: 12.5px; }
  .pager b { color: var(--navy); }
  .footer { margin-top: 28px; color: var(--ink-3); font-size: 12.5px; }

  .fade { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .menu-btn { display: inline-block; }
    .brand span { display: none; }
    .ver { display: none; }
    .topbar { padding: 10px 16px; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .langs button { padding: 5px 8px; }
    .sidebar { position: fixed; z-index: 30; top: 52px; left: 0; width: 280px; background: var(--bg); box-shadow: 4px 0 20px rgba(0,0,0,.12); transform: translateX(-105%); transition: transform .2s; }
    .sidebar.open { transform: none; }
    .main { padding: 20px 16px 48px; }
    .sec-title { font-size: 25px; }
    .arch { grid-template-columns: 1fr; gap: 8px; }
    .arch .wires { padding: 4px 0; }
    .model { flex-direction: column; }
    .model .arrow { transform: rotate(90deg); padding: 2px 0; }
    .hero { padding: 22px 20px; }
    .hero h1 { font-size: 24px; }
    .pager button { max-width: none; }
  }
  @media (max-width: 640px) {
    table.ep thead { display: none; }
    table.ep tr { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    table.ep tr.grp-h { display: block; background: #f8fafc; }
    table.ep td { border: 0; padding: 0; min-width: 0; }
    table.ep td.c-dir { grid-column: 1; }
    table.ep td.c-desc { grid-column: 1 / -1; }
    table.ep td.c-doc { grid-column: 1 / -1; }
    table.fl thead { display: none; }
    table.fl tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    table.fl td { border: 0; padding: 0; }
    table.fl td.fname { white-space: normal; word-break: break-word; }
    table.fl td:last-child { grid-column: 1 / -1; }
    .seq-svg text { font-size: 15px; }
  }
</style>
